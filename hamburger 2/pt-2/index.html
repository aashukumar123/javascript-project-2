<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>color fliper</title>
    <Script src="index.js" defer></Script>
    <style>
        .Green{
            background-color: green;
            height: 70px;
            width: 150px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            font-family: sans-serif;
            transition: all;
            transition-duration: 0.9s;
            transition-delay: 0.9ms;
            transition-timing-function: ease;
            margin: 16px;
            padding: 10px;
           
        }
        button:hover{
            height: 55px;
            width: 125px;
            font-size:16px;
            border-radius: 8px;
            background-color: aliceblue;
            border: none;
        }
        .Red{
            background-color: red;
            height: 70px;
            width: 150px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            font-family: sans-serif;
            transition: all;
            transition-duration: 0.9s;
            transition-delay: 0.9ms;
            margin: 16px;
            padding: 10px;
            
            transition-timing-function: ease;
        }
    .Blue{
        background-color:  blue;
            height: 70px;
            width: 150px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            font-family: sans-serif;
            transition: all;
            transition-duration: 0.9s;
            transition-delay: 0.9ms;
            transition-timing-function: ease;
            margin: 16px;
            padding: 10px;
    }
       .Random{
        background-color: orangered;
            height: 70px;
            width: 150px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            font-family: sans-serif;
            transition: all;
            transition-duration: 0.9s;
            transition-delay: 0.9ms;
            transition-timing-function: ease;
            margin: 16px;
            padding: 10px;
       }
    </style>
</head>
<body>
    <h1>COLOR FLIPPER</h1>
    <button  class="Green">Green</button>
    <button  class="Red">Red </button>
    <button  class="Blue">Blue</button>
    <button   class="Random">Random</button>
    
</body>
</html>
