<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>step Proggress bar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="progress-con">
          <hr class="progress-back">
          <hr class="progress-front">
          
          <div class="step checked"><i class="fa-solid fa-check"></i>
          <small>start</small></div>
          <div class="step"><i class="fa-regular fa-circle-xmark"></i></div>
          <div class="step"><i class="fa-regular fa-circle-xmark"></i></div>
          <div class="step"><i class="fa-regular fa-circle-xmark"></i></div>
          <div class="step"><i class="fa-regular fa-circle-xmark"></i></div>
        </div>
        <button class="btn" id="prev"  ><i class="fa-solid fa-arrow-left"></i></button>
        <button class="btn" id="next" ><i class="fa-solid fa-arrow-right"></i></button>
      </div> 


    <script src="index.js"></script>
</body>
</html>
